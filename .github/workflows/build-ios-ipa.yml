name: Build private iOS IPA

# Manual artifact export only. No Apple, TestFlight, or attribution credentials.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: iOS 15 arm64 unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Test IPA export contract
        run: python3 -m unittest discover -s .github/scripts -p test_package_ios_ipa.py -v

      - name: Select native Xcode
        uses: ./.github/actions/setup-xcode

      - name: Set up pinned Flutter and workspace
        uses: ./.github/actions/setup-flutter

      - name: Prefetch native libraries for tests
        uses: ./.github/actions/prefetch-sqlite3-native
        with:
          workspace: client

      - name: Test existing session resynchronization
        working-directory: client/module_core
        run: dart test test/cubits/session_detail/transcript_builder_test.dart test/cubits/session_detail/transcript_turns_test.dart

      - name: Prefetch native libraries for iOS
        uses: ./.github/actions/prefetch-sqlite3-native
        with:
          workspace: client
          platform: ios

      - name: Cache SwiftPM release artifacts
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm/artifacts/https___github_com_*
          key: swiftpm-github-artifacts-ios-${{ hashFiles('client/app/ios/Runner.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'client/pubspec.lock') }}

      - name: Build real iPhone app without signing
        working-directory: client/app
        run: flutter build ios --release --no-codesign

      - name: Package and inspect IPA
        env:
          BUILD_COMMIT: ${{ github.sha }}
          BUILD_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import json
          import plistlib
          import subprocess
          import sys
          import zipfile
          from pathlib import Path

          sys.path.insert(0, ".github/scripts")
          from package_ios_ipa import is_static_archive

          app = Path("client/app/build/ios/iphoneos/Runner.app")
          diagnostics = []
          for path in sorted((app / "Frameworks").glob("*.framework/Info.plist")):
              info = plistlib.loads(path.read_bytes())
              name = info.get("CFBundleExecutable")
              binary = path.parent / name if isinstance(name, str) and Path(name).name == name else None
              present = binary is not None and binary.is_file()
              with binary.open("rb") if present else open("/dev/null", "rb") as stream:
                  header = stream.read(8).hex()
              print(json.dumps({"framework": path.parent.name, "executable": name,
                                "minimumOSVersion": info.get("MinimumOSVersion"),
                                "binaryPresent": present, "headerHex": header,
                                "staticArchive": is_static_archive(path=binary) if present else False,
                                "entries": sorted(item.name for item in path.parent.iterdir())}))
              if present and info.get("MinimumOSVersion") == "100.0":
                  diagnostics.extend((path, binary))
                  print(f"Native framework inspection: {path.parent.name}", flush=True)
                  subprocess.run(["file", str(binary)], check=True)
                  subprocess.run(["xcrun", "otool", "-hv", "-l", "-L", str(binary)], check=True)
          if diagnostics:
              print("App runtime dependencies", flush=True)
              subprocess.run(["xcrun", "otool", "-L", str(app / "Runner")], check=True)
              output = Path("build/ios-framework-diagnostics.zip")
              output.parent.mkdir(parents=True, exist_ok=True)
              with zipfile.ZipFile(output, "x", compression=zipfile.ZIP_DEFLATED) as archive:
                  for path in diagnostics:
                      archive.write(path, path.relative_to(app).as_posix())
          PY
          python3 .github/scripts/package_ios_ipa.py \
            --app client/app/build/ios/iphoneos/Runner.app \
            --output build/ios-private-ipa \
            --commit "$BUILD_COMMIT" --run-url "$BUILD_RUN_URL"

      - name: Upload failed-build framework diagnostics
        if: failure() && hashFiles('build/ios-framework-diagnostics.zip') != ''
        uses: actions/upload-artifact@v7
        with:
          name: ios-framework-diagnostics-${{ github.run_number }}
          path: build/ios-framework-diagnostics.zip
          if-no-files-found: error
          retention-days: 7

      - name: Upload IPA, checksum and provenance
        id: artifact
        uses: actions/upload-artifact@v7
        with:
          name: Sesori-ios15-arm64-unsigned-${{ github.run_number }}
          path: build/ios-private-ipa/
          if-no-files-found: error
          retention-days: 30

      - name: Download and signing status
        env:
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          {
            echo '## Unsigned iOS 15 arm64 IPA'
            echo "[Download IPA, SHA256SUMS and build-info.json]($ARTIFACT_URL)"
            echo 'No TestFlight upload. Signing and installation have NOT been verified.'
            echo 'Use a compatible signer or jailbreak installer; this is not an App Store-signed IPA.'
            cat build/ios-private-ipa/SHA256SUMS
          } >> "$GITHUB_STEP_SUMMARY"
